services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: newsdev
      POSTGRES_USER: newsdev
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Preencha POSTGRES_PASSWORD no .env}
    volumes:
      - newsdev-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U newsdev -d newsdev"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  api:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      SUPABASE_DB_URL: jdbc:postgresql://db:5432/newsdev
      SUPABASE_DB_USER: newsdev
      SUPABASE_DB_PASSWORD: ${POSTGRES_PASSWORD:?Preencha POSTGRES_PASSWORD no .env}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      JWT_SECRET: ${JWT_SECRET:?Preencha JWT_SECRET no .env}
      CORS_ORIGINS: http://localhost:${WEB_PORT:-3000},http://127.0.0.1:${WEB_PORT:-3000}
      INGESTION_ENABLED: ${INGESTION_ENABLED:-true}
      TECH_FEEDS_ENABLED: ${INGESTION_ENABLED:-true}
    restart: unless-stopped

  web:
    build: ./radar
    depends_on:
      api:
        condition: service_started
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:80"
    restart: unless-stopped

volumes:
  newsdev-postgres:
