spring:
  application:
    name: fionova-api
  task:
    scheduling:
      # Coleta RSS, sinopses e Google News rodam em paralelo; com 1 thread uma trava as outras.
      pool:
        size: ${SCHEDULER_THREADS:4}
  datasource:
    url: ${SUPABASE_DB_URL:jdbc:postgresql://localhost:5432/postgres}
    username: ${SUPABASE_DB_USER:postgres}
    password: ${SUPABASE_DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
      connection-timeout: 10000
  flyway:
    enabled: ${DB_MIGRATIONS_ENABLED:true}
    schemas: fionova
    default-schema: fionova
    create-schemas: true
    locations: classpath:db/migration
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:false}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  jackson:
    default-property-inclusion: non_null
  mvc:
    problemdetails:
      enabled: false
server:
  port: ${PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
  tomcat:
    max-http-form-post-size: 1MB
    max-swallow-size: 1MB
management:
  health:
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      cache:
        time-to-live: 30s
springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:false}
radar:
  share:
    android-fingerprints: "${SHARE_ANDROID_FINGERPRINTS:CF:32:61:FC:32:FC:75:1A:B9:3D:2C:5C:C4:1B:4C:7E:A2:4C:62:BA:29:58:9A:81:0E:7D:3B:A1:88:CC:CA:D7}"
  translation:
    gemini-key: ${GEMINI_API_KEY:}
    gemini-model: ${GEMINI_TRANSLATION_MODEL:gemini-3.5-flash-lite}
  supabase:
    url: ${SUPABASE_URL:}
    publishable-key: ${SUPABASE_PUBLISHABLE_KEY:}
  push:
    webhook-url: ${PUSH_WEBHOOK_URL:}
    webhook-secret: ${PUSH_WEBHOOK_SECRET:}
  mail:
    from: ${MAIL_FROM:radar@localhost}
    reset-url: ${PASSWORD_RESET_URL:radar://recuperar-senha}
  delivery:
    enabled: ${DELIVERY_ENABLED:false}
  ingestion:
    enabled: ${INGESTION_ENABLED:false}
    allowed-hosts: ${RSS_ALLOWED_HOSTS:}
    tech-feeds-enabled: ${TECH_FEEDS_ENABLED:false}
    licensed-feeds-enabled: ${TECH_LICENSED_FEEDS_ENABLED:false}
    delay-ms: ${INGESTION_DELAY_MS:900000}
    google-news:
      # Busca por tópico no Google News (RSS de busca, sem chave). Desligado por padrão.
      # Segue a coleta do catálogo se GOOGLE_NEWS_ENABLED não for definido.
      enabled: ${GOOGLE_NEWS_ENABLED:${radar.ingestion.tech-feeds-enabled:false}}
      delay-ms: ${GOOGLE_NEWS_DELAY_MS:1800000}
      per-topic: ${GOOGLE_NEWS_PER_TOPIC:8}
      # Sites buscados (só sinopse + link). Texto completo só nos full-text-hosts.
      sites: ${GOOGLE_NEWS_SITES:g1.globo.com,agenciabrasil.ebc.com.br,cnnbrasil.com.br,r7.com,band.com.br,sbt.com.br,tvcultura.com.br}
      full-text-hosts: ${GOOGLE_NEWS_FULLTEXT_HOSTS:agenciabrasil.ebc.com.br}
  security:
    secret: ${JWT_SECRET}
    issuer: radar-api
    access-seconds: 3600
    anonymous-seconds: 2592000
    refresh-days: 30
    cors-origins: ${CORS_ORIGINS:http://localhost:3000}
  bootstrap:
    admin-email: ${ADMIN_EMAIL:}
    admin-password: ${ADMIN_PASSWORD:}
